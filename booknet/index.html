<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character Network Viewer</title>
    <style>
      :root { --app-viewport-height: 100vh; }
      html, body { height: 100%; min-height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #1f2937; }
      .app { display: grid; grid-template-rows: 1fr auto; height: var(--app-viewport-height, 100vh); min-height: 100%; overflow: hidden; }
      .main { display: flex; gap: 0; padding: 12px 12px 0; box-sizing: border-box; min-height: 0; overflow: auto; }
      .stage { position: relative; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: linear-gradient(180deg, #fff, #f9fafb); flex: 1 1 auto; min-width: 150px; }
      .sidebar { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; overflow-y: auto; background: #ffffff; overscroll-behavior: contain; flex: 0 0 320px; max-width: 1500px; min-width: 100px; display: flex; flex-direction: column; }
      .sidebar h2 { margin: 0 0 8px; font-size: 18px; }
      .sidebar .muted { color: #6b7280; font-size: 12px; }
      .sidebar .event-list { list-style: none; padding: 0; margin: 8px 0 0; }
      .sidebar .event-item { padding: 6px 8px; border-radius: 6px; border: 1px solid transparent; cursor: default; }
      .sidebar .event-item:hover { background: #f9fafb; border-color: #e5e7eb; }
      .sidebar .event-item .meta { color: #6b7280; font-size: 12px; }
      .sidebar .evidence { margin-top: 8px; padding: 8px; background: #f3f4f6; border-radius: 6px; color: #374151; font-size: 13px; display: none; }
      #textDock { display: none; padding: 0; flex: 0 0 360px; min-width: 100px; max-width: 1500px; position: relative; }
      .main.show-text-dock #textDock { display: flex; flex-direction: column; }
      .text-dock-close {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 999px;
        background: rgba(17,24,39,0.85);
        color: #f9fafb;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(15,23,42,0.2);
        z-index: 2;
      }
      .text-dock-close:hover { background: rgba(17,24,39,0.95); }
      .text-dock-close:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
      #textFrame { border: 0; width: 100%; flex: 1; min-height: 320px; }
      /* Text dock toolbar */
      .text-dock-bar { display: flex; align-items: center; gap: 6px; padding: 8px; border-bottom: 1px solid #e5e7eb; background: #ffffff; z-index: 1; }
      .text-dock-zoom-btn {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 999px;
        background: rgba(17,24,39,0.85);
        color: #f9fafb;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(15,23,42,0.2);
      }
      .text-dock-zoom-btn:hover { background: rgba(17,24,39,0.95); }
      .text-dock-zoom-btn:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
      .resize-handle { width: 10px; cursor: col-resize; position: relative; flex: 0 0 10px; touch-action: none; }
      .resize-handle::after { content: ''; position: absolute; left: 50%; top: 12px; bottom: 12px; width: 2px; transform: translateX(-50%); background: #d1d5db; border-radius: 999px; }
      /* Highlight only for active resizable handles */
      #handleStageSidebar:hover::after, #handleStageSidebar.dragging::after { background: #9ca3af; }
      .main.show-text-dock #handleDockStage:hover::after, #handleDockStage.dragging::after { background: #9ca3af; }
      /* Always keep the dock handle visible so the toggle is accessible */
      #handleDockStage { display: block; }

      /* Dock toggle button on the dock-stage handle */
      .dock-toggle-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 999px;
        background: rgba(17,24,39,0.85);
        color: #f9fafb;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(15,23,42,0.2);
        z-index: 3;
      }
      .dock-toggle-btn:hover { background: rgba(17,24,39,0.95); }
      .dock-toggle-btn:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }


      .bottom-bar { position: sticky; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e5e7eb; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -2px 6px rgba(0,0,0,0.04); display: flex; align-items: center; gap: 12px; }
      .bottom-bar .label { min-width: 0; color: #374151; }
      input[type=range] { width: 100%; }
      .dual-range { position: relative; height: 32px; display: grid; align-items: center; flex: 1 1 auto; min-width: 120px; width: auto; --thumb-size: 16px; --track-height: 6px; }
      .dual-range .track { position: absolute; left: 0; right: 0; height: var(--track-height); top: 50%; transform: translateY(-50%); background: linear-gradient(to right, #e5e7eb 0%, #e5e7eb 100%); border-radius: 9999px; }
      .dual-range input[type=range] { position: absolute; left: 0; right: 0; top: 0; bottom: 0; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; height: 32px; }
      .dual-range input[type=range]::-webkit-slider-runnable-track { height: 6px; background: transparent; }
      .dual-range input[type=range]::-moz-range-track { height: 6px; background: transparent; }
      .dual-range input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; height: var(--thumb-size); width: var(--thumb-size); border-radius: 9999px; background: #3b82f6; border: 2px solid #ffffff; box-shadow: 0 0 0 1px #9ca3af; pointer-events: auto; cursor: pointer; margin-top: calc((var(--track-height) - var(--thumb-size)) / 2); }
      .dual-range input[type=range]::-moz-range-thumb { height: var(--thumb-size); width: var(--thumb-size); border-radius: 9999px; background: #3b82f6; border: 2px solid #ffffff; box-shadow: 0 0 0 1px #9ca3af; pointer-events: auto; cursor: pointer; }

      /* Center drag handle: sits above end handles, square-ish and shorter */
      .dual-range .center-handle {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: #1d4ed8; /* slightly darker than end handles */
        border: 2px solid #ffffff;
        box-shadow: 0 0 0 1px #6b7280;
        z-index: 2; /* above the range thumbs */
        pointer-events: auto;
        cursor: grab;
      }
      .dual-range .center-handle.dragging { cursor: grabbing; }

      /* Tooltip for node hover */
      .tooltip { position: fixed; pointer-events: none; background: #111827; color: #f9fafb; padding: 8px 10px; font-size: 12px; border-radius: 6px; max-width: 360px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); opacity: 0; transition: opacity 80ms ease-out; z-index: 50; }

      /* SVG node styles */
      .node { cursor: pointer; }
      .node circle { fill: #3b82f6; stroke: #fff; stroke-width: 1px; }
      .node.inactive circle { fill: #9ca3af; }
      .node text { font-size: 11px; fill: #111827; user-select: none; }

      /* Node highlight when hovering from sidebar list */
      .node.highlight circle { fill: #f59e0b; }
      .node.highlight text { font-weight: 700; }

      /* Edge styles */
      .edge { cursor: pointer; }
      /* Edge colors and widths are set dynamically in app.js; keep only opacity here */
      .edge line { opacity: 0.9; }
      .edge:hover line { opacity: 1; }
      .edge.highlight line { opacity: 1; filter: saturate(1.2); stroke-width: 3px; }

      /* Tabs in character panel */
      #charHeader { font-weight: 700; font-size: 16px; margin: 2px 0 4px; }
      .sidebar .home-btn, .sidebar .back-btn { width: 24px; height: 24px; border: none; border-radius: 6px; background: rgba(17,24,39,0.85); color: #f9fafb; cursor: pointer; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(15,23,42,0.2); }
      .sidebar .home-btn { margin-right: 6px; }
      .sidebar .home-btn:hover, .sidebar .back-btn:hover { background: rgba(17,24,39,0.95); }
      .sidebar .home-btn:focus-visible, .sidebar .back-btn:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
      .sidebar .back-btn[disabled] { opacity: 0.6; cursor: default; background: rgba(17,24,39,0.6); color: #e5e7eb; }
      .sidebar .title-row { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; }
      .tabs { display: flex; gap: 6px; margin: 6px 0 8px; }
      .tabs button { border: 1px solid #e5e7eb; background: #f9fafb; padding: 6px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; color: #374151; }
      .tabs button[aria-selected="true"] { background: #111827; color: #f9fafb; border-color: #111827; }
      .tab-view { display: none; }
      .tab-view.active { display: block; }

      /* Sidebar mini charts */
      .charts { margin: 6px 0 8px; }
      .chart-block { margin: 6px 0 10px; }
      .chart-title { font-size: 11px; color: #6b7280; margin: 2px 0 4px; }
      .chart-area { height: 84px; border: 1px solid #e5e7eb; border-radius: 6px; background: #f9fafb; overflow: hidden; }
      .chart-area svg { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="main" id="mainLayout">
        <!-- FAR LEFT: Text Dock -->
        <aside class="sidebar text-dock" id="textDock">
          <div class="text-dock-bar" role="toolbar" aria-label="Text controls">
            <button id="textZoomOutBtn" class="text-dock-zoom-btn" type="button" aria-label="Decrease text size" title="Decrease text size">−</button>
            <button id="textZoomInBtn" class="text-dock-zoom-btn" type="button" aria-label="Increase text size" title="Increase text size">+</button>
          </div>
          <iframe id="textFrame" title="Source text viewer"></iframe>
        </aside>

        <!-- handle between text dock and stage -->
        <div class="resize-handle" id="handleDockStage" data-handle="dock-stage" role="separator" aria-label="Resize source text panel">
          <button class="dock-toggle-btn" id="toggleTextDockBtn" type="button" aria-label="Expand source text panel" title="Show source text">&gt;</button>
        </div>

        <!-- MIDDLE: Stage -->
        <div class="stage" id="stage">
          <svg id="network" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="tooltip" id="tooltip"></div>
        </div>

        <!-- handle between stage and right sidebar -->
        <div class="resize-handle" id="handleStageSidebar" data-handle="stage-sidebar" role="separator" aria-label="Resize character panel"></div>

        <!-- RIGHT: Character Sidebar -->
        <aside class="sidebar" id="sidebar">
          <div class="title-row">
            <button id="sidebarBackBtn" class="back-btn" type="button" aria-label="Go back" title="Go back">←</button>
            <button id="sidebarHomeBtn" class="home-btn" type="button" aria-label="Show active characters" title="Show active characters">⌂</button>
            <h2 id="sidebarTitle" style="margin: 0">Character Details</h2>
          </div>
          <div class="muted" id="sidebarHint">Click a node or edge to see facts within the selected range.</div>
          <!-- Browse panel shown when no selection is active -->
          <div id="browsePanel" style="display:none;">
            <div class="muted" id="browseStatus"></div>
            <ul class="event-list" id="browseList"></ul>
          </div>
          <div id="charPanel" style="display:none;">
          <div id="charHeader"></div>
          <div id="charSummary" style="margin: 4px 0 6px; color: #374151; font-size: 13px;"></div>
          <div class="tabs" id="charTabs" role="tablist" aria-label="Character views">
            <button id="tabFacts" role="tab" aria-selected="true" aria-controls="viewFacts">Facts</button>
            <button id="tabRels" role="tab" aria-selected="false" aria-controls="viewRels">Relationships</button>
          </div>
          <!-- Facts view -->
          <div id="viewFacts" class="tab-view active" role="tabpanel" aria-labelledby="tabFacts">
            <div class="charts">
              <div class="chart-block">
                <div class="chart-title">Character activity</div>
                <div id="charFactHist" class="chart-area" aria-label="Character activity histogram"></div>
              </div>
            </div>
            <div class="muted" id="charStatus"></div>
            <ul class="event-list" id="eventList"></ul>
          </div>
          <!-- Relationships view -->
          <div id="viewRels" class="tab-view" role="tabpanel" aria-labelledby="tabRels">
            <div class="charts">
              <div class="chart-block">
                <div class="chart-title">Interactions</div>
                <div id="charInterHist" class="chart-area" aria-label="Character interactions histogram"></div>
              </div>
            </div>
            <div class="muted" id="charRelStatus"></div>
            <ul class="event-list" id="relList"></ul>
          </div>
          </div>
          <div id="interPanel" style="display:none;">
            <div id="interHeader"></div>
            <div id="interSummary" style="margin: 4px 0 6px; color: #374151; font-size: 13px;"></div>
            <!-- Relationship charts: facts + sentiment over time -->
            <div id="interCharts" class="charts">
              <div class="chart-block">
                <div class="chart-title">Relationship facts</div>
                <div id="interFactHist" class="chart-area" aria-label="Relationship facts histogram"></div>
              </div>
              <div class="chart-block">
                <div class="chart-title">Sentiment over time</div>
                <div id="interSentChart" class="chart-area" aria-label="Relationship sentiment chart"></div>
              </div>
            </div>
            <div class="muted" id="interStatus"></div>
            <ul class="event-list" id="interEventList"></ul>
          </div>
        </aside>
      </div>

      <div class="bottom-bar">
        <div class="label" id="progressLabel" style="white-space: nowrap;">Active: 0%–0% • Chunks 0–0/0</div>
        <div class="dual-range" id="rangeWrap">
          <div class="track" id="rangeTrack"></div>
          <input id="rangeStart" type="range" min="0" max="100" step="1" value="0" />
          <input id="rangeEnd" type="range" min="1" max="100" step="1" value="1" />
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
  </html>
