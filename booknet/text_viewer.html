<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Source Text Viewer</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: #111827;
        background: #f9fafb;
        overflow-x: hidden;           /* no horizontal scroll */
        scroll-behavior: smooth;      /* smooth scrolling */
        -webkit-text-size-adjust: none; /* prevent auto text inflation on small sizes */
        text-size-adjust: none;
      }

      .app {
        height: 100vh;
        display: grid;
        grid-template-rows: 1fr;      /* no top bar row */
      }

      .content {
        overflow-y: auto;
        overflow-x: hidden;             /* contain horizontally */
        scrollbar-gutter: stable both-edges; /* reserve scrollbar space even on overlay UIs */
        padding-left: 8px;              /* tighter fixed left gutter */
        padding-right: 24px;            /* generous right gutter to avoid overlay */
        box-sizing: border-box;
      }

      .chunks {
        max-width: 980px;               /* horizontally contained */
        margin: 0;                      /* anchor to left so left gutter is stable */
        padding: 0;                     /* padding handled by parent so it stays unscaled */
        transform-origin: top left;     /* for manual scaling */
      }

      /* Seamless chunks: no white boxes, borders, or shadows */
      .chunk {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        margin: 0;                    /* remove visible segmentation */
        box-shadow: none;
      }

      /* Indicated chunk: emphasize text via weight only */
      .chunk.highlight pre { font-weight: 700; }

      /* Dim chunks outside active range */
      .chunk.dim {
        opacity: 0.45;
        filter: grayscale(10%);
        transition: opacity 160ms ease;
      }
      .chunk.highlight { opacity: 1; filter: none; }

      /* Raw fallback also seamless */
      .raw {
        white-space: pre-wrap;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }

      /* Text wrapping to prevent horizontal overflow */
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
        margin: 0;
        font: inherit;
      }

      a { color: #2563eb; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Top panel removed -->
      <div class="content">
        <div id="container" class="chunks"></div>
      </div>
    </div>

    <script>
      const state = {
        src: '',
        chunkEls: [],
        activeChunk: null,
        activeRange: { start: 1, end: Infinity },
        zoomPct: 100,
        baseMaxWidthPx: 980,
      };

      const container = document.getElementById('container');

      function getQuery() {
        const u = new URL(window.location.href);
        const src = u.searchParams.get('src') || '';
        const chunk = Number(u.searchParams.get('chunk') || '1');
        const nohighlight = u.searchParams.get('nohighlight') === '1' || u.searchParams.get('hl') === '0';
        const nosnap = u.searchParams.get('nosnap') === '1';
        const book = u.searchParams.get('book') || u.searchParams.get('folder') || '';
        return { src, book, chunk: Number.isFinite(chunk) && chunk > 0 ? chunk : 1, nohighlight, nosnap };
      }

      function setQuery(q) {
        const u = new URL(window.location.href);
        u.searchParams.set('src', q.src);
        u.searchParams.set('chunk', String(q.chunk));
        window.history.replaceState({}, '', u);
      }

      function storageKey(src) {
        return src ? `booknet:lastChunk:${src}` : 'booknet:lastChunk';
      }

      function rememberChunk(src, chunk) {
        try {
          window.sessionStorage.setItem(storageKey(src), String(chunk));
        } catch {}
      }

      function readLastChunk(src) {
        try {
          const raw = window.sessionStorage.getItem(storageKey(src));
          const num = Number(raw);
          return Number.isFinite(num) ? num : null;
        } catch {
          return null;
        }
      }

      function buildChunks(chunks) {
        if (state.chunkEls.length) return;
        container.innerHTML = '';
        const frag = document.createDocumentFragment();
        for (let i = 0; i < chunks.length; i++) {
          const div = document.createElement('div');
          div.className = 'chunk';
          div.id = `chunk-${i + 1}`;
          const pre = document.createElement('pre');
          pre.textContent = normalizeSoftNewlines(chunks[i]);
          div.appendChild(pre);
          frag.appendChild(div);
          state.chunkEls.push(div);
        }
        container.appendChild(frag);
        applyRangeDim();
      }

      function normalizeSoftNewlines(text) {
        if (typeof text !== 'string' || !text.length) return text || '';
        // Unify line endings
        let t = text.replace(/\r\n?/g, '\n');
        // Split into paragraphs on two-or-more newlines, then
        // replace single newlines inside paragraphs with spaces.
        const paras = t.split(/\n{2,}/);
        for (let i = 0; i < paras.length; i++) {
          paras[i] = paras[i].replace(/\n/g, ' ');
        }
        return paras.join('\n\n');
      }

      function clampChunk(idx) {
        const total = state.chunkEls.length;
        if (!total) return 1;
        const num = Number(idx);
        if (!Number.isFinite(num)) return 1;
        return Math.min(Math.max(1, Math.round(num)), total);
      }

      function scrollToChunk(idx, behavior = 'auto') {
        const el = state.chunkEls[idx - 1];
        if (el) el.scrollIntoView({ block: 'center', behavior });
      }

      function applyZoomPct(pct) {
        const p = Number(pct);
        if (!Number.isFinite(p) || p <= 0) return;
        state.zoomPct = Math.max(1, Math.round(p));
        const s = state.zoomPct / 100;
        // Prefer transform scaling of the content container to bypass
        // browser minimum font-size limits while keeping width constant.
        if (container) {
          container.style.transform = `scale(${s})`;
          container.style.transformOrigin = 'top left';
          container.style.width = (100 / s) + '%';
          if (Number.isFinite(state.baseMaxWidthPx)) {
            container.style.maxWidth = (state.baseMaxWidthPx / s) + 'px';
          }
        }
        // Keep base font-size at 100% to avoid min-font-size clamping side-effects
        document.documentElement.style.fontSize = '100%';
        document.body.style.fontSize = '100%';
      }

      function setActiveChunk(idx, options = {}) {
        if (!state.chunkEls.length) return;
        const target = clampChunk(idx);
        if (state.activeChunk && state.activeChunk !== target) {
          const prevEl = state.chunkEls[state.activeChunk - 1];
          if (prevEl) prevEl.classList.remove('highlight');
        }
        const el = state.chunkEls[target - 1];
        if (!el) return;
        el.classList.add('highlight');
        if (options.scroll !== false) {
          scrollToChunk(target, options.behavior || 'smooth');
        }
        state.activeChunk = target;
        rememberChunk(state.src, target);
        // Ensure highlight isn’t dimmed
        applyRangeDim();
      }

      function setActiveRange(start, end) {
        const total = state.chunkEls.length || Number.POSITIVE_INFINITY;
        let s = Number(start), e = Number(end);
        if (!Number.isFinite(s)) s = 1;
        if (!Number.isFinite(e)) e = total;
        s = Math.max(1, Math.round(s));
        e = Math.max(1, Math.round(e));
        if (e < s) [s, e] = [e, s];
        state.activeRange = { start: s, end: e };
        applyRangeDim();
      }

      function applyRangeDim() {
        if (!state.chunkEls.length) return;
        const start = Number(state.activeRange?.start) || 1;
        const end = Number(state.activeRange?.end) || state.chunkEls.length;
        for (let i = 0; i < state.chunkEls.length; i++) {
          const idx = i + 1;
          const el = state.chunkEls[i];
          const inRange = idx >= start && idx <= end;
          if (!inRange) {
            el.classList.add('dim');
          } else {
            el.classList.remove('dim');
          }
        }
      }

      async function init() {
        const { src, book, chunk, nohighlight, nosnap } = getQuery();
        state.src = src;
        // Capture base max-width from CSS for correct scaling
        try {
          const cs = window.getComputedStyle(container);
          const mw = parseFloat(cs.maxWidth || '980');
          if (Number.isFinite(mw) && mw > 0) state.baseMaxWidthPx = mw;
        } catch {}

        const rawPath = book
          ? `./data/${encodeURIComponent(book)}/${encodeURIComponent(src)}.txt`
          : `./data/${encodeURIComponent(src)}.txt`;
        const chunksPath = book
          ? `./data/${encodeURIComponent(book)}/${encodeURIComponent(src)}.chunks.json`
          : `./data/${encodeURIComponent(src)}.chunks.json`;

        let chunks = null;
        try {
          const res = await fetch(chunksPath, { cache: 'no-store' });
          if (res.ok) chunks = await res.json();
        } catch (e) {}

        if (Array.isArray(chunks) && chunks.length) {
          buildChunks(chunks);
          const boundedTarget = clampChunk(Math.min(Math.max(1, chunk), chunks.length));

          const previous = readLastChunk(state.src);
          if (!nosnap) {
            if (Number.isFinite(previous)) {
              const clampedPrev = clampChunk(previous);
              if (clampedPrev !== boundedTarget) {
                scrollToChunk(clampedPrev, 'auto');
                if (!nohighlight) window.requestAnimationFrame(() => setActiveChunk(boundedTarget, { scroll: true, behavior: 'smooth' }));
                else window.requestAnimationFrame(() => scrollToChunk(boundedTarget, 'smooth'));
              } else {
                if (!nohighlight) setActiveChunk(boundedTarget, { scroll: true, behavior: 'smooth' });
                else scrollToChunk(boundedTarget, 'smooth');
              }
            } else {
              if (!nohighlight) setActiveChunk(boundedTarget, { scroll: true, behavior: 'smooth' });
              else scrollToChunk(boundedTarget, 'smooth');
            }
          }

          window.addEventListener('keydown', (e) => {
            if (!['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)) return;
            e.preventDefault();
            const direction = (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') ? -1 : 1;
            const current = state.activeChunk || boundedTarget;
            const next = clampChunk(current + direction);
            if (next === current) return;
            setQuery({ src: state.src, chunk: next });
            setActiveChunk(next, { scroll: true, behavior: 'smooth' });
          });
        } else {
          container.className = 'chunks';
          try {
            const res = await fetch(rawPath, { cache: 'no-store' });
            const txt = res.ok ? await res.text() : 'Failed to load raw text.';
            const pre = document.createElement('pre');
            pre.className = 'raw';
            pre.textContent = normalizeSoftNewlines(txt);
            container.appendChild(pre);
          } catch (e) {
            const pre = document.createElement('pre');
            pre.className = 'raw';
            pre.textContent = 'Failed to load raw text.';
            container.appendChild(pre);
          }
        }
      }

      // Listen for range and active-chunk updates from parent
      window.addEventListener('message', (ev) => {
        const data = ev?.data;
        if (!data || !data.type) return;
        if (data.type === 'booknet:setRange') {
          const start = data?.payload?.start;
          const end = data?.payload?.end;
          setActiveRange(start, end);
          return;
        }
        if (data.type === 'booknet:setZoomPct') {
          const pct = data?.payload?.pct;
          applyZoomPct(pct);
          return;
        }
        if (data.type === 'booknet:setActiveChunk') {
          const chunk = Number(data?.payload?.chunk);
          if (Number.isFinite(chunk) && chunk > 0) setActiveChunk(chunk, { scroll: true, behavior: 'smooth' });
          return;
        }
        if (data.type === 'booknet:clearActiveChunk') {
          if (state.activeChunk != null) {
            const prevEl = state.chunkEls[state.activeChunk - 1];
            if (prevEl) prevEl.classList.remove('highlight');
            state.activeChunk = null;
          }
          return;
        }
        if (data.type === 'booknet:scrollToChunk') {
          const chunk = Number(data?.payload?.chunk);
          const target = clampChunk(chunk);
          scrollToChunk(target, 'smooth');
          return;
        }
      });

      init();
      // Apply default zoom once (in case parent hasn't sent yet)
      applyZoomPct(state.zoomPct);
    </script>
  </body>
</html>
