<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow">
    <title>Source Text Viewer</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: #111827;
        background: #f9fafb;
        overflow-x: hidden;           /* no horizontal scroll */
        /* Avoid global smooth scroll to keep control in JS */
        /* scroll-behavior intentionally omitted here */
        -webkit-text-size-adjust: none; /* prevent auto text inflation on small sizes */
        text-size-adjust: none;
      }

      .app {
        height: 100vh;
        display: grid;
        grid-template-rows: 1fr;      /* no top bar row */
      }

      .content {
        overflow-y: auto;
        overflow-x: hidden;             /* contain horizontally */
        scrollbar-gutter: stable both-edges; /* reserve scrollbar space even on overlay UIs */
        padding-left: 2px;              /* further reduced left gutter */
        padding-right: 14px;            /* slightly increased right gutter */
        box-sizing: border-box;
      }

      .chunks {
        max-width: 980px;               /* horizontally contained */
        margin: 0;                      /* anchor to left so left gutter is stable */
        padding: 0;                     /* padding handled by parent so it stays unscaled */
      }

      /* Seamless chunks: no white boxes, borders, or shadows */
      .chunk {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        margin: 0;                    /* remove visible segmentation */
        box-shadow: none;
      }

      /* Indicated chunk: emphasize text via a faded yellow highlight */
      .chunk.highlight pre { background: rgba(255, 255, 0, 0.4); }

      /* Dim chunks outside active range */
      .chunk.dim {
        opacity: 0.45;
        filter: grayscale(10%);
        transition: opacity 160ms ease;
      }
      .chunk.highlight { opacity: 1; filter: none; }

      /* Raw fallback also seamless */
      .raw {
        white-space: pre-wrap;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }

      /* Text wrapping to prevent horizontal overflow */
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
        margin: 0;
        font: inherit;
      }

      a { color: #2563eb; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Top panel removed -->
      <div class="content">
        <div id="container" class="chunks"></div>
      </div>
    </div>

    <script>
      const state = {
        src: '',
        chunkEls: [],
        activeChunks: new Set(),
        activeChunk: null,
        activeRange: { start: 1, end: Infinity },
        zoomPct: 100,
      };

      const container = document.getElementById('container');
      const scrollHost = container?.closest('.content') || container?.parentElement || null;

      function getQuery() {
        const u = new URL(window.location.href);
        const src = u.searchParams.get('src') || '';
        const chunk = Number(u.searchParams.get('chunk') || '1');
        const nohighlight = u.searchParams.get('nohighlight') === '1' || u.searchParams.get('hl') === '0';
        const nosnap = u.searchParams.get('nosnap') === '1';
        const book = u.searchParams.get('book') || u.searchParams.get('folder') || '';
        return { src, book, chunk: Number.isFinite(chunk) && chunk > 0 ? chunk : 1, nohighlight, nosnap };
      }

      function setQuery(q) {
        const u = new URL(window.location.href);
        u.searchParams.set('src', q.src);
        u.searchParams.set('chunk', String(q.chunk));
        window.history.replaceState({}, '', u);
      }

      function storageKey(src) {
        return src ? `booknet:lastChunk:${src}` : 'booknet:lastChunk';
      }

      function rememberChunk(src, chunk) {
        try {
          window.sessionStorage.setItem(storageKey(src), String(chunk));
        } catch {}
      }

      function readLastChunk(src) {
        try {
          const raw = window.sessionStorage.getItem(storageKey(src));
          const num = Number(raw);
          return Number.isFinite(num) ? num : null;
        } catch {
          return null;
        }
      }

      function buildChunks(chunks) {
        if (state.chunkEls.length) return;
        container.innerHTML = '';
        const frag = document.createDocumentFragment();
        for (let i = 0; i < chunks.length; i++) {
          const div = document.createElement('div');
          div.className = 'chunk';
          div.id = `chunk-${i + 1}`;
          const pre = document.createElement('pre');
          pre.textContent = normalizeSoftNewlines(chunks[i]);
          div.appendChild(pre);
          frag.appendChild(div);
          state.chunkEls.push(div);
        }
        container.appendChild(frag);
        applyRangeDim();
      }

      function normalizeSoftNewlines(text) {
        if (typeof text !== 'string' || !text.length) return text || '';
        // Unify line endings
        let t = text.replace(/\r\n?/g, '\n');
        // Split into paragraphs on two-or-more newlines, then
        // replace single newlines inside paragraphs with spaces.
        const paras = t.split(/\n{2,}/);
        for (let i = 0; i < paras.length; i++) {
          paras[i] = paras[i].replace(/\n/g, ' ');
        }
        return paras.join('\n\n');
      }

      function clampChunk(idx) {
        const total = state.chunkEls.length;
        if (!total) return 1;
        const num = Number(idx);
        if (!Number.isFinite(num)) return 1;
        return Math.min(Math.max(1, Math.round(num)), total);
      }

      function scrollToChunk(idx, behavior = 'auto') {
        const el = state.chunkEls[idx - 1];
        if (!el) return;
        const scroller = scrollHost;
        if (!scroller || typeof scroller.scrollTo !== 'function') {
          el.scrollIntoView({ block: 'start', behavior });
          return;
        }
        // Single-pass precise scroll using visual delta and current scale.
        const pad = 6; // desired visual padding from top (in CSS pixels)
        const elRect = el.getBoundingClientRect();
        const scRect = scroller.getBoundingClientRect();
        const deltaPx = (elRect.top - scRect.top) - pad; // visual pixels
        const targetTop = scroller.scrollTop + deltaPx;
        const maxTop = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
        const clampedTop = Math.min(Math.max(0, targetTop), maxTop);
        scroller.scrollTo({ top: clampedTop, behavior: behavior === 'smooth' ? 'smooth' : 'auto' });
      }

      // Ensure scrolling occurs after any pending layout/zoom changes apply
      function scheduleScrollToChunk(idx, behavior = 'auto') {
        requestAnimationFrame(() => scrollToChunk(idx, behavior));
      }

      function captureScrollAnchor(scroller) {
        if (!scroller) return null;
        const scRect = scroller.getBoundingClientRect();
        const anchorX = Math.round(scRect.left + 6);
        const anchorY = Math.round(scRect.top + 3);
        const visualOffset = anchorY - scRect.top;
        let marker = null;
        try {
          let range = null;
          if (document.caretRangeFromPoint) {
            range = document.caretRangeFromPoint(anchorX, anchorY);
          } else if (document.caretPositionFromPoint) {
            const pos = document.caretPositionFromPoint(anchorX, anchorY);
            if (pos) {
              range = document.createRange();
              range.setStart(pos.offsetNode, pos.offset);
              range.collapse(true);
            }
          }
          if (range) {
            marker = document.createElement('span');
            marker.setAttribute('data-scroll-anchor', '');
            marker.style.cssText = 'display:inline-block;width:0;height:0;padding:0;margin:0;border:0;';
            range.insertNode(marker);
          }
        } catch {}
        return {
          marker,
          scRect,
          visualOffset,
          prevScrollTop: scroller.scrollTop,
          prevScrollHeight: scroller.scrollHeight,
          clientHeight: scroller.clientHeight,
        };
      }

      function restoreScrollAnchor(scroller, anchor) {
        if (!scroller || !anchor) return;
        const maxTop = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
        let usedMarker = false;
        if (anchor.marker && anchor.scRect) {
          try {
            const scRect = scroller.getBoundingClientRect();
            const markerRect = anchor.marker.getBoundingClientRect();
            const deltaPx = (markerRect.top - scRect.top) - anchor.visualOffset;
            const targetTop = scroller.scrollTop + deltaPx;
            scroller.scrollTo({ top: Math.min(Math.max(0, targetTop), maxTop), behavior: 'auto' });
            usedMarker = true;
          } catch {}
        }
        if (anchor.marker && anchor.marker.parentNode) {
          try { anchor.marker.parentNode.removeChild(anchor.marker); } catch {}
        }
        if (usedMarker) return;

        const prevScrollable = Math.max(0, Number(anchor.prevScrollHeight || 0) - Number(anchor.clientHeight || 0));
        const prevTop = Number(anchor.prevScrollTop);
        if (prevScrollable > 0 && Number.isFinite(prevTop)) {
          const ratio = Math.min(Math.max(prevTop / prevScrollable, 0), 1);
          const newScrollable = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
          const targetTop = ratio * newScrollable;
          scroller.scrollTo({ top: Math.min(Math.max(0, targetTop), maxTop), behavior: 'auto' });
          return;
        }
        if (Number.isFinite(prevTop)) {
          scroller.scrollTo({ top: Math.min(Math.max(0, prevTop), maxTop), behavior: 'auto' });
        }
      }

      const MIN_ZOOM_PCT = 50; // do not allow reduction below 50%

      function applyZoomPct(pct) {
        const p = Number(pct);
        if (!Number.isFinite(p) || p <= 0) return;

        const scroller = scrollHost;
        let anchor = null;
        if (scroller) anchor = captureScrollAnchor(scroller);

        state.zoomPct = Math.max(MIN_ZOOM_PCT, Math.round(p));
        if (container) {
          container.style.removeProperty('transform');
          container.style.removeProperty('width');
          container.style.removeProperty('maxWidth');
          container.style.fontSize = `${state.zoomPct}%`;
        }
        document.documentElement.style.removeProperty('font-size');
        document.body.style.removeProperty('font-size');

        if (scroller) {
          requestAnimationFrame(() => restoreScrollAnchor(scroller, anchor));
        }
      }

      function clearActiveChunks() {
        if (!state.chunkEls.length) return;
        if (state.activeChunks instanceof Set) {
          for (const idx of state.activeChunks) {
            const el = state.chunkEls[idx - 1];
            if (el) el.classList.remove('highlight');
          }
        }
        state.activeChunks = new Set();
        state.activeChunk = null;
        applyRangeDim();
      }

      function setActiveChunks(list, options = {}) {
        if (!state.chunkEls.length) return;
        const normalized = Array.from(new Set(
          (Array.isArray(list) ? list : [list])
            .map((n) => Number(n))
            .filter((n) => Number.isFinite(n) && n >= 1 && n <= state.chunkEls.length)
        )).sort((a, b) => a - b);
        if (!normalized.length) {
          clearActiveChunks();
          return;
        }
        const nextSet = new Set(normalized);
        if (state.activeChunks instanceof Set) {
          for (const idx of state.activeChunks) {
            if (!nextSet.has(idx)) {
              const prevEl = state.chunkEls[idx - 1];
              if (prevEl) prevEl.classList.remove('highlight');
            }
          }
        }
        for (const idx of nextSet) {
          const el = state.chunkEls[idx - 1];
          if (el) el.classList.add('highlight');
        }
        state.activeChunks = nextSet;
        const primary = normalized[0];
        state.activeChunk = primary ?? null;
        if (options.scroll !== false && primary != null) {
          scheduleScrollToChunk(primary, options.behavior || 'smooth');
        }
        if (primary != null) rememberChunk(state.src, primary);
        applyRangeDim();
      }

      function setActiveChunk(idx, options = {}) {
        setActiveChunks([idx], options);
      }

      function setActiveRange(start, end) {
        const total = state.chunkEls.length || Number.POSITIVE_INFINITY;
        let s = Number(start), e = Number(end);
        if (!Number.isFinite(s)) s = 1;
        if (!Number.isFinite(e)) e = total;
        s = Math.max(1, Math.round(s));
        e = Math.max(1, Math.round(e));
        if (e < s) [s, e] = [e, s];
        state.activeRange = { start: s, end: e };
        applyRangeDim();
      }

      function applyRangeDim() {
        if (!state.chunkEls.length) return;
        const start = Number(state.activeRange?.start) || 1;
        const end = Number(state.activeRange?.end) || state.chunkEls.length;
        for (let i = 0; i < state.chunkEls.length; i++) {
          const idx = i + 1;
          const el = state.chunkEls[i];
          const inRange = idx >= start && idx <= end;
          if (!inRange) {
            el.classList.add('dim');
          } else {
            el.classList.remove('dim');
          }
        }
      }

      async function init() {
        const { src, book, chunk, nohighlight, nosnap } = getQuery();
        state.src = src;
        const rawPath = book
          ? `./data/${encodeURIComponent(book)}/${encodeURIComponent(src)}.txt`
          : `./data/${encodeURIComponent(src)}.txt`;
        const chunksPath = book
          ? `./data/${encodeURIComponent(book)}/${encodeURIComponent(src)}.chunks.json`
          : `./data/${encodeURIComponent(src)}.chunks.json`;

        let chunks = null;
        try {
          const res = await fetch(chunksPath, { cache: 'no-store' });
          if (res.ok) chunks = await res.json();
        } catch (e) {}

        if (Array.isArray(chunks) && chunks.length) {
          buildChunks(chunks);
          const boundedTarget = clampChunk(Math.min(Math.max(1, chunk), chunks.length));

          const previous = readLastChunk(state.src);
          if (!nosnap) {
            if (Number.isFinite(previous)) {
              const clampedPrev = clampChunk(previous);
              if (clampedPrev !== boundedTarget) {
                scheduleScrollToChunk(clampedPrev, 'auto');
                if (!nohighlight) window.requestAnimationFrame(() => setActiveChunk(boundedTarget, { scroll: true, behavior: 'smooth' }));
                else window.requestAnimationFrame(() => scrollToChunk(boundedTarget, 'smooth'));
              } else {
                if (!nohighlight) setActiveChunk(boundedTarget, { scroll: true, behavior: 'smooth' });
                else scheduleScrollToChunk(boundedTarget, 'smooth');
              }
            } else {
              if (!nohighlight) setActiveChunk(boundedTarget, { scroll: true, behavior: 'smooth' });
              else scheduleScrollToChunk(boundedTarget, 'smooth');
            }
          }

          window.addEventListener('keydown', (e) => {
            if (!['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)) return;
            e.preventDefault();
            const direction = (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') ? -1 : 1;
            const current = state.activeChunk || boundedTarget;
            const next = clampChunk(current + direction);
            if (next === current) return;
            setQuery({ src: state.src, chunk: next });
            setActiveChunk(next, { scroll: true, behavior: 'smooth' });
          });
        } else {
          container.className = 'chunks';
          try {
            const res = await fetch(rawPath, { cache: 'no-store' });
            const txt = res.ok ? await res.text() : 'Failed to load raw text.';
            const pre = document.createElement('pre');
            pre.className = 'raw';
            pre.textContent = normalizeSoftNewlines(txt);
            container.appendChild(pre);
          } catch (e) {
            const pre = document.createElement('pre');
            pre.className = 'raw';
            pre.textContent = 'Failed to load raw text.';
            container.appendChild(pre);
          }
        }
      }

      // Listen for range and active-chunk updates from parent
      window.addEventListener('message', (ev) => {
        const data = ev?.data;
        if (!data || !data.type) return;
        const payload = data?.payload || {};
        if (data.type === 'booknet:setRange') {
          const start = payload.start;
          const end = payload.end;
          setActiveRange(start, end);
          return;
        }
        if (data.type === 'booknet:setZoomPct') {
          const pct = payload.pct;
          applyZoomPct(pct);
          return;
        }
        if (data.type === 'booknet:setActiveChunks') {
          const chunks = payload.chunks;
          const opts = {};
          if (payload.scroll === false) opts.scroll = false;
          if (payload.behavior) opts.behavior = payload.behavior;
          if (Array.isArray(chunks)) setActiveChunks(chunks, opts);
          return;
        }
        if (data.type === 'booknet:setActiveChunk') {
          const chunk = Number(payload.chunk);
          const opts = {};
          if (payload.scroll === false) opts.scroll = false;
          if (payload.behavior) opts.behavior = payload.behavior;
          if (Number.isFinite(chunk) && chunk > 0) setActiveChunks([chunk], opts);
          return;
        }
        if (data.type === 'booknet:clearActiveChunk') {
          clearActiveChunks();
          return;
        }
        if (data.type === 'booknet:scrollToChunk') {
          const chunk = Number(payload.chunk);
          const target = clampChunk(chunk);
          scheduleScrollToChunk(target, 'smooth');
          return;
        }
      });

      init();
      // Apply default zoom once (in case parent hasn't sent yet)
      applyZoomPct(state.zoomPct);
    </script>
  </body>
</html>
